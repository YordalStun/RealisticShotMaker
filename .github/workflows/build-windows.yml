name: Build Windows app

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          pip install -r requirements-dev.txt
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Build app with PyInstaller
        run: pyinstaller --noconfirm packaging/RealisticShotMaker.spec
      - name: Smoke test the frozen app (command line)
        shell: pwsh
        run: |
          $spec = @{ output = @{ resolution = "preview" } } | ConvertTo-Json
          Set-Content -Path smoke.rsm.json -Value $spec
          & dist/RealisticShotMaker/RealisticShotMaker.exe job smoke.rsm.json --out smoke_out
          if (-not (Get-ChildItem smoke_out -Recurse -Filter job.json)) { throw "job.json was not created" }
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: RealisticShotMaker-Windows
          path: |
            dist/RealisticShotMaker-Setup-*.exe
